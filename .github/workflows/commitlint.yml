name: Commitlint

on:
  push:
    branches:
      - "**"

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate commit messages
        run: bunx commitlint --from HEAD~1 --to HEAD --verbose
